name: Release Game

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GODOT_VERSION: 4.6
  EXPORT_NAME: MathRunner

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version from git tag
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "Using version: $VERSION"
          sed -i 's/config\/version=".*"/config\/version="'"$VERSION"'"/' project.godot

      - name: Download Godot
        run: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Download export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Create build directory
        run: mkdir -p build

      - name: Export Windows build
        run: |
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-release "Windows Desktop" \
            build/${EXPORT_NAME}.exe

      - name: Create zip
        run: |
          cd build
          zip ${EXPORT_NAME}-${GITHUB_REF_NAME}-windows.zip *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          files: |
            build/*.zip
